services:
  backend:
    build: ./backend
    container_name: meitai-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./knowledge:/workspace/knowledge:ro
      - backend_data:/workspace/backend/data
      - backend_exports:/workspace/backend/exports
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////workspace/backend/data/meitai_demo.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:8000
    container_name: meitai-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_exports:
